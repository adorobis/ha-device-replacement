plan:
  fields:
    old_device_id:
      required: true
      selector:
        device: {}
    new_device_id:
      required: true
      selector:
        device: {}
    mapping:
      example: '{"sensor.old_power": "sensor.new_power", "sensor.old_rssi": null}'
      selector:
        object: {}
    auto_match:
      default: true
      selector:
        boolean: {}
    include_sub_devices:
      default: true
      selector:
        boolean: {}
    device_mapping:
      example: '{"<old sub-device id>": "<new sub-device id>"}'
      selector:
        object: {}

execute:
  fields:
    old_device_id:
      required: true
      selector:
        device: {}
    new_device_id:
      required: true
      selector:
        device: {}
    mapping:
      example: '{"sensor.old_power": "sensor.new_power", "sensor.old_rssi": null}'
      selector:
        object: {}
    auto_match:
      default: true
      selector:
        boolean: {}
    include_sub_devices:
      default: true
      selector:
        boolean: {}
    device_mapping:
      example: '{"<old sub-device id>": "<new sub-device id>"}'
      selector:
        object: {}
    keep_units:
      default: true
      selector:
        boolean: {}
    adjust_energy:
      default: true
      selector:
        boolean: {}
    remove_old_device:
      default: false
      selector:
        boolean: {}
    force:
      default: false
      selector:
        boolean: {}
    dry_run:
      default: false
      selector:
        boolean: {}

journal: {}

undo:
  fields:
    record_id:
      example: 01JABCDEFGHJKMNPQRSTVWXYZ0
      selector:
        text: {}
